<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小考日程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2a44;
    --paper: #faf7f0;
    --rule: #d9d3c1;
    --gold: #b9902a;
    --soon: #c1502e;
    --done: #6b8f71;
    --muted: #6b6558;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
    line-height: 1.7;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 8px;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 48px;
    font-size: 0.95rem;
  }

  section + section { margin-top: 64px; }

  h2 {
    font-family: "Noto Serif TC", serif;
    font-size: 1.3rem;
    font-weight: 500;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 0;
  }

  #examList {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #examList li {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 4px 20px;
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
  }

  #examList li.next {
    border-left: 3px solid var(--soon);
    padding-left: 16px;
    margin-left: -19px;
  }

  #examList li.past { opacity: 0.5; }

  .exam-date {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--ink);
    white-space: nowrap;
  }

  .exam-weekday {
    display: block;
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 400;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .exam-subject {
    font-weight: 700;
    grid-column: 2;
  }

  .exam-range {
    grid-column: 2;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .tag {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--soon);
    border: 1px solid var(--soon);
    border-radius: 3px;
    padding: 1px 6px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .status-msg {
    color: var(--muted);
    padding: 20px 0;
  }

  .calendar-wrap {
    margin-top: 24px;
    border: 1px solid var(--rule);
    background: #fff;
  }

  .calendar-wrap iframe {
    display: block;
    width: 100%;
    height: 560px;
    border: 0;
  }

  .quick-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 24px;
  }

  .quick-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    background: #fff;
    border: 1px solid var(--rule);
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .quick-link:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
  }

  .quick-link img {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border: 1px solid var(--rule);
  }

  .quick-link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .quick-link-label {
    font-weight: 700;
    font-size: 0.95rem;
  }

  .quick-link-hint {
    font-size: 0.78rem;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .quick-links {
      grid-template-columns: 1fr;
    }
  }

  footer {
    margin-top: 64px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  #noticeBar {
    display: none;
    background: #fbf1da;
    border-top: 1px solid var(--gold);
    border-bottom: 1px solid var(--gold);
    color: var(--ink);
    font-size: 0.85rem;
    padding: 10px 24px;
    text-align: center;
  }

  #noticeBar .notice-label {
    font-weight: 700;
    color: var(--gold);
    margin-right: 8px;
  }

  #noticeBar .notice-item + .notice-item::before {
    content: "・";
    margin: 0 8px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="noticeBar"></div>
<main>
  <h1>小考日程表</h1>
  <p class="subtitle">HSNU 1640 小考日程表</p>

  <section>
    <h2>近期小考</h2>
    <ul id="examList">
      <li class="status-msg">讀取中…</li>
    </ul>
  </section>

  <section>
    <h2>常用連結</h2>
    <div class="quick-links">
      <a class="quick-link" href="https://docs.google.com/spreadsheets/d/1Qfgs-Q1xZXFvOItKbJ9XCMxUvvyvPaOqbvj2-_CK7-E/edit?usp=sharing" target="_blank" rel="noopener">
        <img src="qr/points.png" alt="查詢積分 QR code">
        <span class="quick-link-text">
          <span class="quick-link-label">查詢我的積分</span>
          <span class="quick-link-hint">掃描 QR code 或點擊連結</span>
        </span>
      </a>
      <a class="quick-link" href="https://docs.google.com/spreadsheets/d/1PvEQlh2XYOFbcYxGHvJxVd56lWSA_Cnbxg8rw1LYMsM/edit?usp=sharing" target="_blank" rel="noopener">
        <img src="qr/attendance.png" alt="確認出席 QR code">
        <span class="quick-link-text">
          <span class="quick-link-label">確認出席（9:00 報到）</span>
          <span class="quick-link-hint">掃描 QR code 或點擊連結</span>
        </span>
      </a>
      <a class="quick-link" href="https://docs.google.com/document/d/11c9enaYtxP38lI158IXoqb64DBojNorKszQW5_gBwtQ/edit?usp=sharing" target="_blank" rel="noopener">
        <img src="qr/chat.png" alt="與 Marc 登記會談 QR code">
        <span class="quick-link-text">
          <span class="quick-link-label">與 Marc 登記會談</span>
          <span class="quick-link-hint">掃描 QR code 或點擊連結</span>
        </span>
      </a>
      <a class="quick-link" href="https://forms.gle/1dxj1hrv1GPtF7J18" target="_blank" rel="noopener">
        <img src="qr/seating.png" alt="座位偏好調查 QR code">
        <span class="quick-link-text">
          <span class="quick-link-label">座位偏好調查</span>
          <span class="quick-link-hint">掃描 QR code 或點擊連結</span>
        </span>
      </a>
    </div>
  </section>

  <section>
    <h2>行事曆</h2>
    <div class="calendar-wrap">
      <iframe src="https://calendar.google.com/calendar/embed?src=c_e6ceeab77c8cea8863b2e8df34854ce4b8ca0e4a859ad3118ac61e08fa343fdd%40group.calendar.google.com&ctz=Asia%2FTaipei" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
    </div>
  </section>

  <footer>所有內容仍以學校公告為準；日程如有不齊全請私訊我或聯絡 310394@gs.hs.ntnu.edu.tw ；本網頁前端有使用AI工具的協助。</footer>
</main>

<script>
  const weekdayNames = ["日", "一", "二", "三", "四", "五", "六"];

  function parseCsv(text) {
    const lines = text.trim().split(/\r?\n/);
    const header = lines.shift().split(",").map(h => h.trim());
    return lines
      .filter(line => line.trim().length > 0)
      .map(line => {
        const cells = line.split(",");
        const row = {};
        header.forEach((key, i) => {
          row[key] = (cells[i] ?? "").trim();
        });
        return row;
      });
  }

  function renderExams(rows) {
    const list = document.getElementById("examList");
    list.innerHTML = "";

    const todayStr = new Date().toISOString().slice(0, 10);

    const valid = rows
      .filter(r => r.date)
      .sort((a, b) => a.date.localeCompare(b.date));

    if (valid.length === 0) {
      list.innerHTML = '<li class="status-msg">目前沒有小考資料</li>';
      return;
    }

    let nextMarked = false;

    valid.forEach(row => {
      const li = document.createElement("li");
      const isPast = row.date < todayStr;
      const isNext = !isPast && !nextMarked;
      if (isNext) nextMarked = true;

      li.className = isPast ? "past" : (isNext ? "next" : "");

      const d = new Date(row.date + "T00:00:00");
      const weekday = isNaN(d) ? "" : weekdayNames[d.getDay()];

      li.innerHTML = `
        <div class="exam-date">${row.date}<span class="exam-weekday">週${weekday}</span></div>
        <div class="exam-subject">${row.subject || ""}${isNext ? '<span class="tag">最近</span>' : ""}</div>
        <div class="exam-range">${row.range || ""}</div>
      `;
      list.appendChild(li);
    });
  }

  function renderNotice(rows) {
    const bar = document.getElementById("noticeBar");
    const todayStr = new Date().toISOString().slice(0, 10);

    const upcoming = rows
      .filter(r => r.date && r.date >= todayStr)
      .sort((a, b) => a.date.localeCompare(b.date));

    if (upcoming.length === 0) return;

    const items = upcoming
      .map(r => `<span class="notice-item">${r.date} ${r.range || ""}</span>`)
      .join("");

    bar.innerHTML = `<span class="notice-label">近期重要事項</span>${items}`;
    bar.style.display = "block";
  }

  fetch("calender.csv", { cache: "no-store" })
    .then(res => {
      if (!res.ok) throw new Error("找不到 calender.csv");
      return res.text();
    })
    .then(text => renderExams(parseCsv(text)))
    .catch(err => {
      document.getElementById("examList").innerHTML =
        `<li class="status-msg">讀取 calender.csv 失敗：${err.message}</li>`;
    });

  fetch("important.csv", { cache: "no-store" })
    .then(res => (res.ok ? res.text() : ""))
    .then(text => text && renderNotice(parseCsv(text)))
    .catch(() => {});
</script>
</body>
</html>
